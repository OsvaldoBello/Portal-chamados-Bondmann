version: 2
updates:
  # Runtime + dev Python deps (requirements.txt / requirements-dev.txt) — Sprint 2 / item 2.5 (M8).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # Janela de quarentena antes de abrir PR de atualização (auditoria de cadeia
    # de suprimentos, 2026-08-26). Pacotes comprometidos costumam ser detectados
    # e despublicados nos primeiros dias; esperar 7 dias (30 para major, que traz
    # mais código novo) tira o repo da janela em que o release malicioso ainda
    # está no registry. Não altera QUAIS versões entram, só quando o PR aparece.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 30
