name: CI

on:
  push:
    branches: [main, develop, claude/develop]
  pull_request:

# Least privilege do GITHUB_TOKEN (auditoria de cadeia de suprimentos,
# 2026-08-26). Sem este bloco os jobs herdam o default do repositório, que pode
# ser read/write em todos os escopos — uma action comprometida teria permissão de
# escrever no repo. Nenhum job aqui usa GITHUB_TOKEN: não há push de imagem
# (`push: false`), comentário em PR, release nem upload de artefato. O cache do
# buildx (`type=gha`) usa ACTIONS_RUNTIME_TOKEN, que é independente deste escopo.
permissions:
  contents: read

# Um push em cima do outro na mesma branch cancela o run anterior — economiza
# minutos sem perder sinal. Em push nas branches de integração NÃO cancela: o
# histórico de "esta branch estava verde neste commit" é o que dá segurança para
# aplicar migration/deploy, e um run cancelado não conta como verde.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: Suíte pytest + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências (runtime + dev)
        run: pip install -r requirements-dev.txt

      # app/static/css/app.css não é versionado (gerado pelo Tailwind CLI, ver
      # .gitignore) — alguns testes de export (test_export_html.py,
      # test_admin.py) leem o arquivo do disco de verdade pra embutir o CSS no
      # relatório self-contained. Sem este passo o checkout do CI não tem o
      # arquivo e esses testes falham com FileNotFoundError (visto ao vivo ao
      # parar de versionar o arquivo, 2026-08-27).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências de front-end
        run: npm ci

      - name: Build do CSS (Tailwind) — necessário pros testes de export
        run: npm run build:css

      # Item 3.1: a suíte completa também mede cobertura; o floor
      # (`[tool.coverage.report] fail_under` no pyproject.toml) reprova o job se
      # a cobertura cair abaixo do piso — um só run faz teste + gate de cobertura.
      - name: Rodar suíte pytest completa (com floor de cobertura)
        run: python -m pytest --cov=app --cov-report=term-missing

  build-css:
    name: Build Tailwind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências de front-end
        run: npm ci

      - name: Build do CSS (Tailwind)
        run: npm run build:css

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    # Achado da revisão de CI/CD (2026-07-29): o `build-css` provava o Tailwind
    # isolado, mas ninguém buildava o Dockerfile — que é o artefato REAL de
    # produção (Railway). Quebra de Dockerfile (ex.: o bump de `python:3.12-slim`
    # -> `3.14-slim` proposto pelo Dependabot) só aparecia no deploy. Aqui o
    # build roda sem push: prova que a imagem monta, sem publicar nada.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Buildar imagem (sem push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrations-sequence:
    name: Numeração de migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Checar cadeia 0001..NNNN contínua em supabase/migrations
        run: python scripts/check_migrations_sequence.py

  vendor-bundles:
    name: Bundles vendorizados (versão + SRI)
    runs-on: ubuntu-latest
    # Achado da auditoria de cadeia de suprimentos (2026-08-26): os arquivos de
    # `app/static/vendor/` são cópias manuais, não saída de build. Nada ligava o
    # `package.json` ao que o browser carrega, então um PR do Dependabot bumpava
    # o manifesto e aparentava corrigir uma CVE sem tocar no arquivo servido —
    # foi o que aconteceu com o supabase-js 2.47.10 e a GHSA-8r88-6cj9-9fh5.
    # Este job também reprova SRI defasado, que faz o browser BLOQUEAR o script
    # e derruba o Realtime sem erro visível.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Checar versão e integrity dos bundles de app/static/vendor
        run: python scripts/check_vendor_bundles.py

  migrations-aplicadas:
    name: Migrations aplicadas no banco
    runs-on: ubuntu-latest
    # Achado da revisão de CI/CD (2026-07-29): nada no pipeline aplica
    # `supabase/migrations/*` — é passo manual —, mas o Railway sobe o código no
    # push. Migration esquecida = app nova contra schema velho (já aconteceu com
    # a 0060/0061). Este job NÃO aplica DDL em produção; ele reprova quando falta
    # aplicar, forçando a ordem certa: schema primeiro, código depois. Sem o
    # secret `SUPABASE_DB_URL` configurado, o script avisa e passa — ver
    # scripts/check_migrations_applied.py.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências (asyncpg)
        run: pip install -r requirements.txt

      - name: Checar migrations pendentes de aplicação
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/check_migrations_applied.py

  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ruff
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: python -m ruff check .

  mypy:
    name: Type-check (mypy, gradual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências (runtime + dev)
        run: pip install -r requirements-dev.txt

      # Item 3.1: type-check gradual — só os módulos em `[tool.mypy] files`
      # (segurança/auth/config/db), sem --strict. Alvo e escopo vivem no
      # pyproject.toml; aqui o job só invoca `mypy` (sem args = usa a config).
      - name: mypy (módulos cobertos)
        run: python -m mypy
