name: CI

on:
  push:
    branches: [main, develop, claude/develop]
  pull_request:

jobs:
  pytest:
    name: Suíte pytest + cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências (runtime + dev)
        run: pip install -r requirements-dev.txt

      # Item 3.1: a suíte completa também mede cobertura; o floor
      # (`[tool.coverage.report] fail_under` no pyproject.toml) reprova o job se
      # a cobertura cair abaixo do piso — um só run faz teste + gate de cobertura.
      - name: Rodar suíte pytest completa (com floor de cobertura)
        run: python -m pytest --cov=app --cov-report=term-missing

  build-css:
    name: Build Tailwind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências de front-end
        run: npm ci

      - name: Build do CSS (Tailwind)
        run: npm run build:css

  migrations-sequence:
    name: Numeração de migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checar cadeia 0001..NNNN contínua em supabase/migrations
        run: python scripts/check_migrations_sequence.py

  ruff:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: python -m ruff check .

  mypy:
    name: Type-check (mypy, gradual)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências (runtime + dev)
        run: pip install -r requirements-dev.txt

      # Item 3.1: type-check gradual — só os módulos em `[tool.mypy] files`
      # (segurança/auth/config/db), sem --strict. Alvo e escopo vivem no
      # pyproject.toml; aqui o job só invoca `mypy` (sem args = usa a config).
      - name: mypy (módulos cobertos)
        run: python -m mypy
