name: E2E RLS

# Item 1.7 (M9) do plano de melhorias: suíte e2e de RLS contra Supabase local real
# (não mock). Roda num job separado do CI principal porque exige Docker (`supabase
# start`) e só é relevante quando migrations/policies ou repositórios mudam — mantém
# o `ci.yml` rápido para o resto dos PRs.

on:
  push:
    branches: [main, develop, claude/develop]
    paths:
      - "supabase/migrations/**"
      - "app/repositories/**"
      - "app/db.py"
      - "tests/e2e/**"
      - ".github/workflows/e2e-rls.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "app/repositories/**"
      - "app/db.py"
      - "tests/e2e/**"
      - ".github/workflows/e2e-rls.yml"

# Least privilege do GITHUB_TOKEN (auditoria de cadeia de suprimentos,
# 2026-08-26). Sem este bloco o job herda o default do repositório, que pode ser
# read/write em todos os escopos — uma action comprometida teria permissão de
# escrever no repo. Este job só faz checkout e roda a suíte; não usa
# GITHUB_TOKEN para nada.
permissions:
  contents: read

# Cancela só runs de PR sobrepostos; em push nas branches de integração o
# histórico de "estava verde neste commit" é o que autoriza aplicar migration.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-rls:
    name: Matriz de RLS (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências (runtime + dev)
        run: pip install -r requirements-dev.txt

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Subir Supabase local (aplica supabase/migrations/*.sql)
        run: supabase start --exclude studio,edge-runtime,imgproxy,vector,analytics

      - name: Rodar suíte e2e de RLS
        env:
          RLS_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python -m pytest tests/e2e -m rls -v

      - name: Parar Supabase local
        if: always()
        run: supabase stop --no-backup
