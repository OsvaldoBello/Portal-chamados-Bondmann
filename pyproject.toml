[project]
name = "portal-chamados-bondmann"
version = "0.1.0"
description = "Portal de Chamados Bondmann Química — Help Desk multi-tenant (FastAPI + Supabase)"
requires-python = ">=3.12"
# Sprint 2 / item 2.5 (M8): `requirements.txt` é a ÚNICA fonte de versões de
# runtime (é o que o Dockerfile e o job `pytest` do CI instalam de fato). Este
# [project] table não tem [build-system] — pip nunca instala a partir daqui —
# então não duplicamos a lista de dependências aqui para não haver dois lugares
# para manter em sincronia. Ver `requirements.txt` (runtime) e
# `requirements-dev.txt` (+ testes/lint).

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = [
  "rls: suíte e2e contra Supabase local real (item 1.7/M9); skip automático sem RLS_DATABASE_URL.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["prototipos"]

[tool.ruff.lint]
# Config mínima para o gate de CI (Sprint 0 / item 0.4): só sintaxe real (E9) e
# pyflakes (F), ignorando as categorias já violadas hoje no código existente
# (imports não usados, anotação de tipo com nome não importado) para não forçar
# reformatação fora do escopo desta migration — alargar aos poucos depois.
select = ["E9", "F"]
ignore = ["F401", "F821"]
