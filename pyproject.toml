[project]
name = "portal-chamados-bondmann"
version = "0.1.0"
description = "Portal de Chamados Bondmann Química — Help Desk multi-tenant (FastAPI + Supabase)"
requires-python = ">=3.12"
# Espelho de requirements.txt — duplicação pendente de eliminar (Sprint 2 /
# item 2.5, M8). Manter em sincronia enquanto isso não roda.
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "supabase==2.11.0",
  "jinja2==3.1.5",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "asyncpg==0.30.0",
  "slowapi==0.1.9",
  "python-multipart==0.0.20",
  "python-magic==0.4.27",
  "python-magic-bin==0.4.14 ; sys_platform == 'win32'",
  "itsdangerous==2.2.0",
  "httpx==0.27.2",
  "pyjwt[crypto]==2.10.1",
  "tzdata==2024.2",
  "holidays==0.100",
  "Pillow==12.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["prototipos"]

[tool.ruff.lint]
# Config mínima para o gate de CI (Sprint 0 / item 0.4): só sintaxe real (E9) e
# pyflakes (F), ignorando as categorias já violadas hoje no código existente
# (imports não usados, anotação de tipo com nome não importado) para não forçar
# reformatação fora do escopo desta migration — alargar aos poucos depois.
select = ["E9", "F"]
ignore = ["F401", "F821"]
