<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Workspace — Bondmann{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script defer src="/static/vendor/htmx.min.js"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"></script>
  <script defer src="/static/vendor/alpine-csp.min.js"
          integrity="sha384-ToFwPnlRgZIoDDSatKvWLkecUR4Py5dma633TT4TVBQfs4nHKXXexI3v72xi5LnC"></script>
  {% block head_scripts %}{% endblock %}
</head>
<body class="min-h-screen bg-surface text-ink font-sans"
      hx-headers='{"{{ csrf_header }}": "{{ csrf_token }}"}'>
  <div class="min-h-screen flex">
    <aside class="hidden md:flex w-60 shrink-0 flex-col bg-navy-900 text-white">
      <div class="px-5 py-5 border-b border-white/10">
        <div class="font-display font-black tracking-tight text-lg">BONDMANN</div>
        <div class="text-[9px] font-medium tracking-[0.42em] text-brandgreen mt-0.5">WORKSPACE</div>
      </div>
      <nav class="flex-1 px-3 py-4 space-y-1 text-sm">
        <a href="/workspace" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 {% if active == 'fila' %}bg-white/10 font-semibold{% endif %}">Fila de chamados</a>
        <a href="/workspace/kanban" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 {% if active == 'kanban' %}bg-white/10 font-semibold{% endif %}">Kanban</a>
        <a href="/admin" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 text-white/70">Admin (TI)</a>
        <a href="/portal" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 text-white/70">Abrir um chamado</a>
      </nav>
      <form method="post" action="/logout" class="px-3 py-4 border-t border-white/10">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="w-full text-left px-3 py-2.5 rounded-lg text-sm text-white/80 hover:bg-white/10">Sair</button>
      </form>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="h-14 bg-white border-b border-line flex items-center justify-between px-6">
        <h1 class="font-display font-bold text-navy">{% block heading %}Workspace{% endblock %}</h1>
        <div class="text-sm text-muted">{{ perfil.nome or "Operador" }}</div>
      </header>
      <main class="flex-1 p-6 max-w-6xl w-full mx-auto">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
